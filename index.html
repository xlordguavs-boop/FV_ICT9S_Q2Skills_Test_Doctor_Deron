<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Q2 Skills Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
    body {      
        background-image: url('https://obmontessori.orangeapps.ph/landing/obmontessori/images/FV%20Facade.jpg');
        background-size: cover;
        background-repeat: no-repeat;
        width: 100%;
        height: 100%;
    } 

    header {
        text-align: center;
        color: white;
        margin-bottom: 25px;
    }

    .heading {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
    }

    .logo {
        background: white;
        border-radius: 50%;
        width: 45px;
        height: 45px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 25px;
    }

    header h1 {
        font-size: 27px;
        font-weight: bold;
        font-family: Arial, sans-serif;
    }

    header p {
        font-size: 11px;
        margin-top: 15px;
    }


    .form-container {
        max-width: 660px;
        margin: auto;
        padding: 15px;
        background: rgba(255, 255, 255, 0.82);
        border-radius: 5px;
    }


    h3 {
        font-size: 15px;
        margin-bottom: 10px;
        margin-top: 5px;
        color: #333;
    }


    .row {
        display: flex;
        gap: 12px;
    }

    .field {
        flex: 1;
        margin-bottom: 10px;
    }

    .field label {
        display: block;
        font-size: 10px;
        margin-bottom: 5px;
        color: #444;
    }


    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="date"],
    select {
        width: 100%;
        padding: 9px;
        border: 1px solid #ddd;
        border-radius: 4px;
        background: white;
        font-size: 11px;
    }

    input:focus,
    select:focus {
        outline: 1px solid #287bea;
        border-color: #287bea;
    }


    .options {
        display: flex;
        flex-direction: column;
        gap: 5px;
    }

    .options label,
    .confirmation label {
        font-size: 10px;
        color: #444;
    }

    .options input,
    .confirmation input {
        margin-right: 5px;
    }


    .confirmation {
        margin-top: 10px;
        margin-bottom: 15px;
    }


    button {
        display: block;
        margin: auto;
        padding: 10px 18px;
        background: #0878e8;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 11px;
    }

    button:hover {
        background: #005fc4;
    }

    </style>

</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
        <a class="navbar-brand" href="#"><img src="https://files.orangeapps.ph/disk001/School_Files/1/school-67/school_profile/1724046702-723.png" alt="obmc-logo" class="img-fluid rounded circle" 
        style="height: 50px; width: 60px;"></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
      <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mynavbar">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="">Enroll</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="">About Us</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="">Contact Us</a>
      </ul>
      <form class="d-flex">
        <a href="https://obmontessori.orangeapps.ph/landing/obmontessori/" class="btn btn-primary ms-2">MY PORTAL</a>
      </form>
    </div>
  </div>
</nav>

     <header>
        <div class="heading">
            <h1>OBMC Student Enrollment Form</h1>
        </div>
    </header>

    <main class="form-container">

        <form>

            <h3>Student Information</h3>

            <div class="row">
                <div class="field">
                    <label>First Name</label>
                    <input type="text" placeholder="John" required>
                </div>

                <div class="field">
                    <label>Last Name</label>
                    <input type="text" placeholder="Doe" required>
                </div>
            </div>

            <div class="row">
                <div class="field">
                    <label>Birth Date</label>
                    <input type="date" required>
                </div>

                <div class="field">
                    <label>Gender</label>
                    <select required>
                        <option value="">Select...</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Prefer not to say</option>
                    </select>
                </div>

                <div class="field">
                    <label>Grade Level</label>
                    <select required>
                        <option value="">Select...</option>
                        <option>Grade 7</option>
                        <option>Grade 8</option>
                        <option>Grade 9</option>
                        <option>Grade 10</option>
                        <option>Grade 11</option>
                        <option>Grade 12</option>
                    </select>
                </div>
            </div>

            <h3>Contact Details</h3>

            <div class="field">
                <label>Email Address</label>
                <input type="email" placeholder="student@example.com" required>
            </div>

            <div class="field">
                <label>Contact Number</label>
                <input type="tel" placeholder="0912-345-6789" required>
            </div>

            <h3>Other Information</h3>

            <div class="field">
                <label>Mode of Learning</label>

                <div class="options">
                    <label>
                        <input type="radio" name="learning" value="Online" required>
                        Online
                    </label>

                    <label>
                        <input type="radio" name="learning" value="Face-to-Face">
                        Face-to-Face
                    </label>
                </div>
            </div>

            <div class="confirmation">
                <label>
                    <input type="checkbox" required>
                    I confirm that the information provided is true and complete.
                </label>
            </div>

            <button type="submit">Submit Enrollment</button>

        </form>

    </main>


            </div>
        </div>


    
</body>
</html>
